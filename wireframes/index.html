            <select class="input" id="dt-epic" ${others.length ? '' : 'disabled title="This board has no epics yet."'}>
              <option value="">${others.length ? 'No epic' : 'No epics on this board yet'}</option>
              ${others.map(e => `<option value="${e.id}" ${e.id === t.epic ? 'selected' : ''}>${esc(e.title)}</option>`).join('')}</select></div>`}
          <hr class="side-rule">
          <dl class="facts">
            ${made ? `<div><dt>${icon('plus')}Created</dt><dd class="num">${mover ? esc(mover.name.split(' ')[0]) + ' · ' : ''}${fmtDate(made.at.slice(0, 10))}</dd></div>` : ''}
            ${since ? `<div><dt>${icon('status')}Time in column</dt><dd class="num">${days(since)}</dd></div>` : ''}
            ${t.rev ? `<div><dt>${icon('move')}Moved</dt><dd class="num">${t.rev} time${t.rev > 1 ? 's' : ''}</dd></div>` : ''}
            ${people?.length ? `<div><dt>${icon('users')}People</dt><dd class="avatars">${people.map(u => avatar(u, `title="${esc(u.name)}"`)).join('')}</dd></div>` : ''}
          </dl>
          <hr class="side-rule">
          ${t.isEpic ? `<button class="btn" id="dt-focus">${icon('arrow')}Show only this epic</button>`
            : `<button class="btn" id="dt-find">${icon('board')}Show on the board</button>`}
        </div>
      </aside>
    </div>
  </div>
</main>`;
}

function detailMeta(b, t, col) {
  const a = t.assignee && user(t.assignee), last = b.columns.length > 1 && col === b.columns[b.columns.length - 1];
  const s = t.isEpic && epicStat(b, t.id);
  return `${t.isEpic ? `<span class="chip" style="${epicHue(t)}">${icon('layers')}Epic · ${s.n} task${s.n === 1 ? '' : 's'}</span>` : ''}
    ${last && !t.isEpic ? `<span class="chip done-chip">${icon('check')}Done</span>` : ''}
    ${a ? `<span class="chip" style="${userHue(a.id)}">${avatar(a)}${esc(a.name)}</span>` : ''}
    ${t.due ? dueChip(t.due) : ''}
    ${t.label ? `<span class="chip label-chip" style="${hue(hashHue(t.label.toLowerCase()))}">${esc(t.label)}</span>` : ''}
    ${t.source ? `<span class="chip src-chip" style="${hue(3)}">${icon('video')}<span>${esc(t.source.title)}</span></span>` : ''}`;
}

// The board's columns as a track; the task sits on one stage and moves with a click.
function stagesView(b, col, since) {
  const ci = b.columns.indexOf(col);
  return `<ol class="stages" aria-label="Column">${b.columns.map((c, i) => `<li class="${i < ci ? 'past' : i === ci ? 'here' : ''} ${i <= ci ? 'reached' : ''}" style="${hue(i + 1)}">
    <button class="stage" data-stage="${c.id}" ${i === ci ? 'aria-current="step"' : `title="Move to ${esc(c.name)}"`}>
      ${i < ci ? icon('check') : '<span class="dot"></span>'}${esc(c.name)}${i === ci && since ? `<small class="num">· ${days(since).toLowerCase()}</small>` : ''}
    </button></li>`).join('')}</ol>`;
}

// Where an epic's tasks sit across the board, one segment per column.
function spreadView(b, e) {
  const s = epicStat(b, e.id);
  return `<section class="spread-wrap" aria-label="Where this epic’s tasks are">
    <div class="spread-top"><b class="num ${s.n && s.done === s.n ? 'all-done' : ''}">${s.done} of ${s.n} done</b>${s.n ? `<span class="num">${s.pct}%</span>` : '<span>Add tasks below to see them spread across the board.</span>'}</div>
    <div class="spread-bar ${s.n ? '' : 'empty'}" role="img" aria-label="${b.columns.map(c => `${s.kids.filter(k => k.c === c).length} in ${esc(c.name)}`).join(', ')}">
      ${b.columns.map((c, i) => { const n = s.kids.filter(k => k.c === c).length; return n ? `<i style="${hue(i + 1)};flex-grow:${n}" title="${n} in ${esc(c.name)}"></i>` : ''; }).join('')}
    </div>
    ${s.n ? `<div class="spread">${b.columns.map((c, i) => { const n = s.kids.filter(k => k.c === c).length, last = i === b.columns.length - 1;
      return `<span class="pip ${n ? '' : 'zero'}" style="${hue(i + 1)}">${last && b.columns.length > 1 ? icon('check') : '<span class="dot"></span>'}<span class="num">${n}</span> ${esc(c.name)}</span>`; }).join('')}</div>` : ''}
  </section>`;
}

// An epic's tasks, grouped by the column they sit in.
function kidsView(b, e) {
  const s = epicStat(b, e.id), home = findTask(e.id).col;
  const groups = b.columns.map((c, i) => ({ c, i, kids: s.kids.filter(k => k.c === c) })).filter(g => g.kids.length);
  return `<div class="subs-head"><span class="label">${icon('layers')}Tasks in this epic</span>
      ${s.n ? `<span class="subs-count num ${s.done === s.n ? 'all-done' : ''}">${s.done} of ${s.n} done</span>` : ''}</div>
    ${groups.map(g => `<div class="kid-group" style="${hue(g.i + 1)}">
      <h3 class="kid-head"><span class="dot" aria-hidden="true"></span>${esc(g.c.name)}<span class="lane-count num">${g.kids.length}</span></h3>
      <div class="epic-list">${g.kids.map(k => {
        const done = s.isDone(k), subs = k.t.subs || [], sd = subs.filter(x => x.done).length, a = k.t.assignee && user(k.t.assignee);
        return `<div class="epic-drow ${done ? 'done' : ''}">
          ${done ? icon('check') : '<span class="dot" aria-hidden="true"></span>'}
          <button type="button" class="epic-name" data-detail="${k.t.id}">${esc(k.t.title)}</button>
          ${subs.length ? `<span class="meta num ${sd === subs.length ? 'all-done' : ''}" title="${sd} of ${subs.length} subtasks done">${icon('check')}${sd}/${subs.length}</span>` : ''}
          ${k.t.due && !done ? dueChip(k.t.due) : ''}
          ${b.shared && a ? avatar(a, `title="Assigned to ${esc(a.name)}"`) : ''}
          <button type="button" class="icon-btn" data-unlink="${k.t.id}" aria-label="Remove “${esc(k.t.title)}” from this epic" title="Remove from epic">${icon('unlink')}</button>
        </div>`; }).join('')}</div>
    </div>`).join('')}
    ${s.n ? '' : `<p class="epic-none">No tasks yet. Add the first one below. It lands in ${esc(home.name)}.</p>`}
    <label class="epic-drow epic-dadd">${icon('plus')}
      <input id="k-new" class="epic-new" maxlength="200" autocomplete="off" placeholder="Add a task to this epic, press Enter" aria-label="New task in this epic"></label>`;
}

// History and comments in one timeline. An epic's timeline also carries what happened to its tasks.
function feedView(b, t) {
  const kids = t.isEpic ? epicKids(b, t.id).flatMap(k => logOf(k.t).filter(e => e.kind === 'moved' || e.kind === 'comment').map(e => ({ e, t: k.t, kid: true }))) : [];
  const items = [...logOf(t).map(e => ({ e, t })), ...kids].sort((x, y) => x.e.at < y.e.at ? -1 : 1)
    .filter(({ e }) => ui.feed === 'all' || (ui.feed === 'comments') === (e.kind === 'comment'));
  if (!items.length) return `<p class="feed-empty">${ui.feed === 'comments' ? 'No comments yet. Start the conversation below.' : 'Nothing has happened here yet. Moves, edits and comments will show up here.'}</p>`;
  const colRef = name => { const i = b.columns.findIndex(c => c.name === name); return `<span class="ev-col" ${i < 0 ? '' : `style="${hue(i + 1)}"`}><span class="dot"></span>${esc(name)}</span>`; };
  return `<ol class="feed">${items.map(({ e, t: on, kid }) => {
    const u = user(e.who), who = `<b>${e.who === db.session ? 'You' : u ? esc(u.name.split(' ')[0]) : 'Someone'}</b>`;
    const obj = kid ? `<button type="button" class="ev-task" data-detail="${on.id}">${esc(on.title)}</button>` : 'this';
    const when = `<time class="num" datetime="${e.at}" title="${new Date(e.at).toLocaleString()}">${ago(e.at)}</time>`;
    if (e.kind === 'comment') return `<li class="ev">${u ? avatar(u) : `<span class="ev-mark">${icon('user')}</span>`}
      <div><div class="ev-line">${who} commented${kid ? ` on ${obj}` : ''} · ${when}</div><p class="bubble ${e.who === db.session ? 'mine' : ''}">${esc(e.text)}</p></div>
      ${e.who === db.session ? `<button type="button" class="icon-btn" data-uncomment="${e.id}" data-on="${on.id}" aria-label="Delete your comment" title="Delete comment">${icon('trash')}</button>` : '<span></span>'}</li>`;
    const to = e.kind === 'assigned' && user(e.to), ci = b.columns.findIndex(c => c.name === e.to);
    const [ic, h, text] = {
      created: ['plus', '', `created ${obj}${e.from ? ` from the meeting <b>${esc(e.from)}</b>` : ''}`],
      moved: ['move', ci < 0 ? '' : hue(ci + 1), `moved ${obj} from ${colRef(e.from)} to ${colRef(e.to)}`],
      assigned: ['user', to ? userHue(to.id) : '', to ? `assigned ${obj} to <b>${e.to === db.session ? 'you' : esc(to.name.split(' ')[0])}</b>` : `unassigned ${obj}`],
      due: ['cal', '', e.to ? `set the due date to <b class="num">${fmtDate(e.to)}</b>` : 'removed the due date'],
      sub: ['check', '--h:var(--c4)', `${e.done ? 'checked off' : 'reopened'} <b>${esc(e.title)}</b>`],
      file: ['clip', '', `${e.removed ? 'removed' : 'attached'} <b>${esc(e.name)}</b>`],
    }[e.kind] || ['status', '', 'changed this'];
    return `<li class="ev"><span class="ev-mark" ${h ? `style="${h}"` : ''}>${icon(ic)}</span><div class="ev-line">${who} ${text} · ${when}</div><span></span></li>`;
  }).join('')}</ol>`;
}

function bindDetail(b) {
  const t = findTask(ui.detailId).task, col = () => findTask(t.id).col;
  // Selects re-render the page, then hand focus back to the control that changed.
  const again = sel => { render(); $(sel)?.focus(); };
  const paintFeed = () => { $('#dt-feed').innerHTML = feedView(b, t); };
  const grow = el => { el.style.height = 'auto'; el.style.height = el.scrollHeight + 'px'; };
  const moveTo = (id, sel) => {
    const from = col(), to = b.columns.find(c => c.id === id);
    if (!to || from === to) return;
    from.tasks.splice(from.tasks.indexOf(t), 1); to.tasks.push(t); t.rev++;
    log(t, 'moved', { from: from.name, to: to.name }); touch(b); again(sel);
  };

  $('#dt-back').onclick = () => openDetail(null);
  $('#detail').onclick = e => {
    const go = e.target.closest('[data-detail]'), un = e.target.closest('[data-unlink]'), del = e.target.closest('[data-uncomment]');
    if (go) openDetail(go.dataset.detail);
    if (un) { delete findTask(un.dataset.unlink).task.epic; save(); again('#k-new'); }
    if (del) { const on = findTask(del.dataset.on).task; on.log = on.log.filter(x => x.id !== del.dataset.uncomment); save(); paintFeed(); $('#dt-comment').focus(); }
  };
  document.querySelectorAll('[data-stage]').forEach(s => s.onclick = () => moveTo(s.dataset.stage, `[data-stage="${s.dataset.stage}"]`));

  const title = $('#dt-title');
  grow(title);
  title.oninput = () => { grow(title); if (title.value.trim()) { t.title = title.value.trim(); save(); $('.crumb-here').textContent = t.title; } };
  title.onkeydown = e => { if (e.key === 'Enter') { e.preventDefault(); title.blur(); } };
  title.onblur = () => { if (!title.value.trim()) { title.value = t.title; grow(title); } };
  const desc = $('#dt-desc');
  grow(desc);
  desc.oninput = () => { grow(desc); t.desc = desc.value; save(); };

  $('#dt-col').onchange = e => moveTo(e.target.value, '#dt-col');
  const who = $('#dt-who'); if (who) who.onchange = e => { t.assignee = e.target.value; log(t, 'assigned', { to: t.assignee }); touch(b); again('#dt-who'); };
  $('#dt-due').onchange = e => { t.due = e.target.value; log(t, 'due', { to: t.due }); save(); again('#dt-due'); };
  // Text fields repaint only the chips under the title, so a click elsewhere is never lost to a re-render.
  $('#dt-label').onchange = e => { t.label = e.target.value.trim(); save(); $('#dt-meta').innerHTML = detailMeta(b, t, col()); };
  const ep = $('#dt-epic'); if (ep) ep.onchange = e => { t.epic = e.target.value || undefined; save(); again('#dt-epic'); };

  bindFiles($('#dt-files'), $('#detail'), t, paintFeed);
  if (!t.isEpic) bindSubs($('#dt-subs'), t.subs ||= [], () => save(), { onCheck: x => { log(t, 'sub', { title: x.title, done: x.done }); paintFeed(); } });
  const kid = $('#k-new');
  if (kid) kid.onkeydown = e => {
    if (e.key !== 'Enter') return;
    e.preventDefault();
    const v = kid.value.trim(); if (!v) return;
    col().tasks.push({ id: uid(), title: v.slice(0, 200), desc: '', label: '', due: '', assignee: '', rev: 0, log: [entry('created')], epic: t.id });
    touch(b); again('#k-new');
  };

  document.querySelectorAll('[name="dt-feed"]').forEach(r => r.onchange = () => { ui.feed = r.value; paintFeed(); });
  const say = $('#dt-say'), box = $('#dt-comment'), send = $('#dt-send');
  box.oninput = () => { grow(box); send.disabled = !box.value.trim(); };
  box.onkeydown = e => { if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) { e.preventDefault(); say.requestSubmit(); } };
  say.onsubmit = e => {
    e.preventDefault();
    const v = box.value.trim(); if (!v) return;
    log(t, 'comment', { text: v.slice(0, 2000) }); save();
    if (ui.feed === 'history') { ui.feed = 'all'; $('[name="dt-feed"][value="all"]').checked = true; }
    paintFeed(); box.value = ''; box.style.height = ''; send.disabled = true; box.focus();
  };

  $('#dt-link').onclick = () => navigator.clipboard?.writeText(location.href).then(() => toast('Link copied'), () => toast('Couldn’t copy. Use the address bar instead.'));
  const find = $('#dt-find');
  if (find) find.onclick = () => {
    openDetail(null);
    const card = document.querySelector(`[data-task="${t.id}"]`);
    card?.classList.add('landed'); card?.scrollIntoView({ block: 'nearest', inline: 'nearest', behavior: 'smooth' });
  };
  const fo = $('#dt-focus'); if (fo) fo.onclick = () => { openDetail(null); focusEpic(t.id); };
  $('#dt-menu').onclick = e => openMenu(e.currentTarget, [
    { icon: 'expand', label: 'Open quick view', run: () => { ui.taskId = t.id; render(); $('#d-title')?.focus(); } },
    '-',
    { icon: 'trash', label: `Delete ${t.isEpic ? 'epic' : 'task'}`, danger: true, run: () => {
      // Same rule as the dialog: deleting an epic keeps its tasks.
      const kids = t.isEpic ? epicKids(b, t.id) : [];
      const msg = kids.length ? `Deleted “${t.title}” · ${kids.length} task${kids.length > 1 ? 's' : ''} kept on the board` : `Deleted “${t.title}”`;
      if (ui.epicId === t.id) ui.epicId = null;
      ui.detailId = null; location.hash = '';
      withUndo(msg, () => { kids.forEach(k => delete k.t.epic); const c = col(); c.tasks.splice(c.tasks.indexOf(t), 1); touch(b); });
    } },
  ], true);
}

/* ---------- Files section (task page and quick view) ---------- */
function filesView(t) {
  const list = t.files || [], photos = list.filter(isImage), docs = list.filter(f => !isImage(f));
  const meta = f => { const u = user(f.who); return `${fmtSize(f.size)}${u ? ` · ${f.who === db.session ? 'You' : esc(u.name.split(' ')[0])}` : ''} · ${ago(f.at)}`; };
  return `<div class="subs-head"><span class="label">${icon('clip')}Files</span>
      ${list.length ? `<span class="subs-count num">${list.length}</span><button type="button" class="btn btn-quiet" data-file-add>${icon('plus')}Add files</button>` : ''}</div>
    <input type="file" multiple hidden data-file-input>
    ${photos.length ? `<div class="photos">${photos.map(f => `<figure class="photo">
        <button type="button" data-file-view="${f.id}" aria-label="View ${esc(f.name)}"><img data-blob="${f.id}" alt="${esc(f.name)}"></button>
        <figcaption title="${esc(f.name)} · ${meta(f)}">${esc(f.name)}</figcaption>
        <button type="button" class="icon-btn" data-file-del="${f.id}" aria-label="Remove ${esc(f.name)}" title="Remove">${icon('trash')}</button>
      </figure>`).join('')}</div>` : ''}
    ${docs.length ? `<div class="file-list">${docs.map(f => `<div class="file-row" style="${hue(hashHue(extOf(f.name)))}">
        <span class="tile" aria-hidden="true">${icon('file')}</span>
        <button type="button" class="file-main" data-file-open="${f.id}" title="Open ${esc(f.name)} in a new tab"><b>${esc(f.name)}</b><small class="num">${meta(f)}</small></button>
        <button type="button" class="icon-btn" data-file-get="${f.id}" aria-label="Download ${esc(f.name)}" title="Download">${icon('download')}</button>
        <button type="button" class="icon-btn" data-file-del="${f.id}" aria-label="Remove ${esc(f.name)}" title="Remove">${icon('trash')}</button>
      </div>`).join('')}</div>` : ''}
    ${list.length ? '' : `<button type="button" class="files-drop" data-file-add>${icon('upload')}
      <span>Drop photos or files here, or <u>browse</u></span><small>Up to 10 MB each. You can also paste a screenshot.</small></button>`}`;
}

// host: the Files section. zone: the surface that accepts drops and pastes (the page or the dialog).
function bindFiles(host, zone, t, changed) {
  const paint = () => {
    host.innerHTML = filesView(t);
    host.querySelectorAll('img[data-blob]').forEach(img => fileUrl(img.dataset.blob).then(u => { if (u) img.src = u; }));
  };
  const add = async list => {
    const ok = [], big = [];
    for (const file of list) {
      if (file.size > MAX_FILE) { big.push(file.name); continue; }
      const f = { id: uid(), name: file.name || `Pasted image ${new Date().toLocaleTimeString()}.png`, type: file.type, size: file.size, at: new Date().toISOString(), who: db.session };
      try { await blobs.put(f.id, file); ok.push(f); } catch { return toast('This browser can’t store files here. Try a normal window.'); }
    }
    if (ok.length) {
      (t.files ||= []).push(...ok); ok.forEach(f => log(t, 'file', { name: f.name })); save(); paint(); changed();
      toast(ok.length > 1 ? `${ok.length} files attached` : `Attached “${ok[0].name}”`);
    }
    if (big.length) toast(`${big.length > 1 ? `${big.length} files are` : `“${big[0]}” is`} over 10 MB, so ${big.length > 1 ? 'they weren’t' : 'it wasn’t'} attached.`);
  };
  const open = (id, download) => fileUrl(id).then(u => {
    if (!u) return toast('That file is no longer in this browser.');
    const f = t.files.find(x => x.id === id), a = document.createElement('a');
    a.href = u; if (download) a.download = f.name; else { a.target = '_blank'; a.rel = 'noopener'; }
    a.click();
  });
  const remove = id => {
    const i = t.files.findIndex(x => x.id === id), f = t.files[i];
    t.files.splice(i, 1); log(t, 'file', { name: f.name, removed: true }); save(); paint(); changed();
    toast(`Removed “${f.name}”`, () => { t.files.splice(i, 0, f); t.log = t.log.filter(e => !(e.kind === 'file' && e.removed && e.name === f.name)); save(); paint(); changed(); });
  };
  paint();
  host.onclick = e => {
    const el = e.target.closest('[data-file-add], [data-file-view], [data-file-open], [data-file-get], [data-file-del]');
    if (!el) return;
    if (el.matches('[data-file-add]')) host.querySelector('[data-file-input]').click();
    else if (el.dataset.fileView) openViewer(t, el.dataset.fileView, remove);
    else if (el.dataset.fileOpen) open(el.dataset.fileOpen);
    else if (el.dataset.fileGet) open(el.dataset.fileGet, true);
    else if (el.dataset.fileDel) remove(el.dataset.fileDel);
  };
  host.onchange = e => { if (e.target.matches('[data-file-input]')) { add([...e.target.files]); e.target.value = ''; } };
  // Only file drags light up the section; dragging a card between lanes is left alone.
  const hasFiles = e => [...(e.dataTransfer?.types || [])].includes('Files');
  let depth = 0;
  zone.addEventListener('dragenter', e => { if (hasFiles(e)) { depth++; host.classList.add('dropping'); } });
  zone.addEventListener('dragleave', e => { if (hasFiles(e) && --depth <= 0) { depth = 0; host.classList.remove('dropping'); } });
  zone.addEventListener('dragover', e => { if (hasFiles(e)) e.preventDefault(); });
  zone.addEventListener('drop', e => { if (!hasFiles(e)) return; e.preventDefault(); depth = 0; host.classList.remove('dropping'); add([...e.dataTransfer.files]); });
  zone.addEventListener('paste', e => { const f = [...(e.clipboardData?.files || [])]; if (f.length) { e.preventDefault(); add(f); } });
}

/* ---------- Photo viewer: full screen, arrows and ←/→ step through the task's photos ---------- */
function openViewer(t, id, remove) {
  const photos = t.files.filter(isImage);
  let i = photos.findIndex(f => f.id === id);
  const v = document.createElement('dialog');
  v.className = 'viewer'; v.setAttribute('aria-label', 'Photo viewer');
  document.body.append(v);
  const show = () => {
    const f = photos[i], u = user(f.who);
    v.innerHTML = `<header class="viewer-bar"><div><b>${esc(f.name)}</b>
        <small class="num">${photos.length > 1 ? `${i + 1} of ${photos.length} · ` : ''}${fmtSize(f.size)}${u ? ` · ${esc(u.name)}` : ''} · ${ago(f.at)}</small></div>
        <button class="icon-btn" data-v="get" aria-label="Download" title="Download">${icon('download')}</button>
        <button class="icon-btn" data-v="del" aria-label="Remove this photo" title="Remove">${icon('trash')}</button>
        <button class="icon-btn" data-v="close" aria-label="Close viewer">${icon('close')}</button></header>
      <div class="viewer-stage">
        ${photos.length > 1 ? `<button class="icon-btn nav" data-v="prev" aria-label="Previous photo">${icon('arrow-left')}</button>` : ''}
        <img alt="${esc(f.name)}">
        ${photos.length > 1 ? `<button class="icon-btn nav" data-v="next" aria-label="Next photo">${icon('arrow')}</button>` : ''}
      </div>`;
    fileUrl(f.id).then(src => { if (src) v.querySelector('img').src = src; });
    v.querySelector('[data-v="close"]').focus();
  };
  const step = d => { i = (i + d + photos.length) % photos.length; show(); };
  const close = () => { v.close(); v.remove(); document.querySelector(`[data-file-view="${photos[i]?.id}"]`)?.focus(); };
  v.onclick = e => {
    const a = e.target.closest('[data-v]')?.dataset.v;
    if (a === 'prev') step(-1); if (a === 'next') step(1); if (a === 'close' || e.target.classList.contains('viewer-stage')) close();
    if (a === 'get') fileUrl(photos[i].id).then(u => { const l = document.createElement('a'); l.href = u; l.download = photos[i].name; l.click(); });
    if (a === 'del') { const f = photos[i]; close(); remove(f.id); }
  };
  v.onkeydown = e => { if (e.key === 'ArrowLeft') step(-1); if (e.key === 'ArrowRight') step(1); };
  v.oncancel = e => { e.preventDefault(); close(); };
  show(); v.showModal();
}

/* ---------- Menus & toast ---------- */
function openMenu(anchor, items, alignRight) {
  closeMenu();
  const m = document.createElement('div');
  m.className = 'menu'; m.setAttribute('role', 'menu');
  m.innerHTML = items.map((it, i) => it === '-' ? '<hr>' : it.head ? `<div class="menu-head">${it.head}</div>`
    : `<button class="menu-item ${it.danger ? 'danger' : ''}" role="menuitem" data-i="${i}">${icon(it.icon)}${esc(it.label)}</button>`).join('');
  document.body.append(m);
  const r = anchor.getBoundingClientRect(), up = r.bottom + m.offsetHeight > innerHeight - 8;
  m.style.top = (up ? r.top - m.offsetHeight - 6 : r.bottom + 6) + 'px';
  m.style.left = Math.max(8, alignRight ? r.right - m.offsetWidth : r.left) + 'px';
  m.style.setProperty('--origin', `${up ? 'bottom' : 'top'} ${alignRight ? 'right' : 'left'}`);
  anchor.setAttribute('aria-expanded', 'true');
  m.onclick = e => { const b = e.target.closest('[data-i]'); if (b) { closeMenu(); items[b.dataset.i].run(); } };
  m.querySelector('button')?.focus();
  openMenu.cur = { m, anchor };
}
function closeMenu() {
  const c = openMenu.cur; if (!c) return;
  c.m.remove(); c.anchor.setAttribute('aria-expanded', 'false'); openMenu.cur = null;
}
document.addEventListener('pointerdown', e => { if (openMenu.cur && !openMenu.cur.m.contains(e.target) && !openMenu.cur.anchor.contains(e.target)) closeMenu(); });
document.addEventListener('keydown', e => {
  if (e.key !== 'Escape') return;
  if (openMenu.cur) { const a = openMenu.cur.anchor; closeMenu(); a.focus(); }
  else if (ui.composer) { ui.composer = null; render(); }
  else if (ui.epicId && !ui.taskId && !ui.detailId) focusEpic(null);
});

function toast(msg, undo) {
  $('.toast')?.remove();
  const el = document.createElement('div');
  el.className = 'toast'; el.setAttribute('role', 'status');
  el.innerHTML = `${icon(undo ? 'trash' : 'spark')}<span>${esc(msg)}</span>${undo ? '<button>Undo</button>' : ''}`;
  document.body.append(el);
  if (undo) el.querySelector('button').onclick = () => { el.remove(); undo(); };
  setTimeout(() => el.remove(), 5000);
}
function withUndo(msg, mutate) {
  const snap = JSON.stringify(db.boards);
  mutate(); save(); render();
  toast(msg, () => { db.boards = JSON.parse(snap); save(); render(); });
}

function focusEpic(id) {
  const prev = ui.epicId;
  ui.epicId = id; ui.composer = null; render();
  // Leaving focus puts the cursor back on the epic's own card.
  (id ? $('#focus-clear') : document.querySelector(`[data-task="${prev}"]`))?.focus();
}

function closeDrawer() {
  const id = ui.taskId; ui.taskId = null; render();
  document.querySelector(`[data-task="${id}"]`)?.focus();
}

function inlineRename(el, current, commit) {
  el.contentEditable = 'true'; el.textContent = current; el.focus();
  getSelection().selectAllChildren(el);
  const done = ok => {
    el.onblur = el.onkeydown = null;
    const v = el.textContent.trim();
    if (ok && v && v !== current) commit(v.slice(0, 60));
    render();
  };
  el.onkeydown = e => { if (e.key === 'Enter') { e.preventDefault(); done(true); } if (e.key === 'Escape') { e.stopPropagation(); done(false); } };
  el.onblur = () => done(true);
}

/* ---------- Drag: dashed slot while moving, fading gap at origin ---------- */
function bindDrag(b) {
  let dragId = null, originH = 0;
  const trace = document.createElement('div'); trace.className = 'trace';
  document.querySelectorAll('[data-task]').forEach(card => {
    card.ondragstart = e => {
      dragId = card.dataset.task; originH = card.offsetHeight; trace.style.height = originH + 'px';
      e.dataTransfer.effectAllowed = 'move'; e.dataTransfer.setData('text/plain', dragId);
      requestAnimationFrame(() => card.classList.add('dragging'));
    };
    card.ondragend = () => { card.classList.remove('dragging'); trace.remove(); dragId = null; document.querySelectorAll('.drag-over').forEach(l => l.classList.remove('drag-over')); };
  });
  document.querySelectorAll('.lane').forEach(lane => {
    const list = lane.querySelector('.tasks');
    lane.ondragover = e => {
      if (!dragId) return;
      e.preventDefault();
      if (!lane.classList.contains('drag-over')) { document.querySelectorAll('.drag-over').forEach(l => l.classList.remove('drag-over')); lane.classList.add('drag-over'); }
      const after = [...list.querySelectorAll('.card:not(.dragging)')].find(c => { const r = c.getBoundingClientRect(); return e.clientY < r.top + r.height / 2; });
      list.querySelector('.lane-empty')?.classList.add('hidden');
      if (after) { if (trace.nextSibling !== after) list.insertBefore(trace, after); }
      else if (trace.parentNode !== list || trace.nextSibling) list.append(trace);
    };
    lane.ondragleave = e => { if (!lane.contains(e.relatedTarget)) { lane.classList.remove('drag-over'); trace.remove(); list.querySelector('.lane-empty')?.classList.remove('hidden'); } };
    lane.ondrop = e => {
      e.preventDefault();
      if (!dragId || !trace.parentNode) return;
      const before = trace.nextElementSibling?.dataset.task;
      const from = findTask(dragId), to = b.columns.find(c => c.id === list.dataset.drop);
      const fromIdx = from.col.tasks.indexOf(from.task);
      from.col.tasks.splice(fromIdx, 1);
      const idx = before ? to.tasks.findIndex(t => t.id === before) : to.tasks.length;
      to.tasks.splice(idx < 0 ? to.tasks.length : idx, 0, from.task);
      const moved = from.col !== to;
      if (moved) { from.task.rev++; log(from.task, 'moved', { from: from.col.name, to: to.name }); touch(b); } else save();
      const id = dragId, fromCol = from.col.id; dragId = null;
      render();
      const landed = document.querySelector(`[data-task="${id}"]`);
      landed?.classList.add('landed');
      if (moved) {
        const ghost = document.createElement('div'); ghost.className = 'ghost'; ghost.style.height = originH + 'px';
        const fromList = document.querySelector(`[data-drop="${fromCol}"]`);
        fromList.querySelector('.lane-empty')?.remove();
        fromList.insertBefore(ghost, fromList.children[fromIdx] || null);
        ghost.addEventListener('animationend', () => { ghost.remove(); if (!fromList.children.length) render(); });
      }
    };
  });
}

/* ---------- Subtasks editor (both task modals; `epic` turns it into a first-tasks composer) ---------- */
function subsView(list, { optional, epic } = {}) {
  const n = list.length, done = list.filter(x => x.done).length;
  const word = epic ? 'task' : 'subtask';
  return `<div class="subs-head"><span class="label">${icon(epic ? 'layers' : 'check')}${epic ? 'First tasks' : 'Subtasks'}${optional ? ' <span class="opt">optional</span>' : ''}</span>
      ${!epic && n ? `<span class="subs-count num ${done === n ? 'all-done' : ''}">${done} of ${n}</span>` : ''}</div>
    ${!epic && n ? `<div class="subs-bar" role="progressbar" aria-label="Subtasks done" aria-valuemin="0" aria-valuemax="${n}" aria-valuenow="${done}"><i style="width:${done / n * 100}%"></i></div>` : ''}
    ${list.map(x => `<div class="sub-row" data-sub="${x.id}">
      ${epic ? '<span class="dot" aria-hidden="true"></span>' : `<input type="checkbox" ${x.done ? 'checked' : ''} aria-label="Done: ${esc(x.title)}">`}
      <input class="sub-text" value="${esc(x.title)}" maxlength="200" autocomplete="off" aria-label="${epic ? 'Task' : 'Subtask'} title">
      <button type="button" class="icon-btn" data-sub-del aria-label="Remove ${esc(x.title) || word}">${icon('trash')}</button>
    </div>`).join('')}
    <label class="sub-row sub-add">${icon('plus')}<input class="sub-text sub-new" maxlength="200" autocomplete="off" placeholder="Add a ${word}, press Enter" aria-label="New ${word}"></label>`;
}
// Edits `list` in place; changed(true) when the count or order changed, changed(false) for renames.
function bindSubs(host, list, changed, opts = {}) {
  const sub = el => list.find(x => x.id === el?.closest?.('[data-sub]')?.dataset.sub);
  // Repaint, then put focus back on the same control.
  const paint = focus => {
    const id = sub(focus)?.id, isNew = focus?.classList?.contains('sub-new'), what = focus?.type === 'checkbox' ? '[type=checkbox]' : '.sub-text';
    host.innerHTML = subsView(list, opts);
    (isNew ? host.querySelector('.sub-new') : id && host.querySelector(`[data-sub="${id}"] ${what}`))?.focus();
  };
  const meter = () => {
    const n = list.length, done = list.filter(x => x.done).length, c = host.querySelector('.subs-count'), bar = host.querySelector('.subs-bar');
    c.textContent = `${done} of ${n}`; c.classList.toggle('all-done', done === n);
    bar.setAttribute('aria-valuenow', done); bar.firstElementChild.style.width = done / n * 100 + '%';
  };
  const remove = (x, focus) => {
    list.splice(list.indexOf(x), 1);
    paint(focus); changed(true);
  };
  paint();
  host.onchange = e => { const x = sub(e.target); if (x && e.target.type === 'checkbox') { x.done = e.target.checked; opts.onCheck?.(x); meter(); changed(true); } };
  host.oninput = e => { const x = sub(e.target); if (x && e.target.type !== 'checkbox') { x.title = e.target.value; changed(false); } };
  host.onclick = e => { const x = e.target.closest('[data-sub-del]') && sub(e.target); if (x) remove(x, host.querySelector('.sub-new')); };
  // A row emptied and left behind is removed rather than saved blank.
  // (No onfocusout property exists; each host element is new per dialog, so this binds once.)
  host.addEventListener('focusout', e => {
    const x = sub(e.target);
    if (x && e.target.classList.contains('sub-text') && !x.title.trim()) remove(x, host.contains(e.relatedTarget) ? e.relatedTarget : null);
  });
  host.onkeydown = e => {
    if (e.metaKey || e.ctrlKey) return; // ⌘/Ctrl + Enter still submits the dialog
    const x = sub(e.target);
    if (e.key === 'Enter' && e.target.classList.contains('sub-new')) {
      e.preventDefault();
      const v = e.target.value.trim(); e.target.value = '';
      if (v) { list.push({ id: uid(), title: v, done: false }); paint(e.target); changed(true); }
    } else if (e.key === 'Enter' && x) {
      e.preventDefault(); host.querySelector('.sub-new').focus();
    } else if (e.key === 'Backspace' && x && e.target.classList.contains('sub-text') && !e.target.value) {
      e.preventDefault(); remove(x, host.querySelector('.sub-new'));
    }
  };
}

    if (asEpic) { ui.openEpics.add(t.id); kept.forEach(title => c.tasks.push({ id: uid(), title, desc: '', label: '', due: '', assignee: '', rev: 0, log: [entry('created')], epic: t.id })); }
    touch(b);

    card?.classList.add('landed'); card?.focus({ preventScroll: true }); card?.scrollIntoView({ block: 'nearest', inline: 'nearest', behavior: 'smooth' });

      : `Task added to ${c.name}`);
  };
}

      ${b.shared ? `<div class="field"><label class="label" for="${id('who')}">${icon('user')}Assignee</label>
        <select class="input" id="${id('who')}" data-k="who"><option value="">Unassigned</option>
          ${b.members.map(user).filter(Boolean).map(u => `<option value="${u.id}" ${u.id === d.who ? 'selected' : ''}>${esc(u.name)}</option>`).join('')}</select>
        ${missing ? `<span class="field-hint">Suggested ${esc(t.who)}, who isn’t on this board.</span>` : ''}</div>` : ''}
      <div class="field"><label class="label" for="${id('due')}">${icon('cal')}Due date</label>
        <input class="input num" id="${id('due')}" data-k="due" type="date" value="${esc(d.due)}"></div>
      <div class="field"><label class="label" for="${id('label')}">${icon('tag')}Label</label>
        <input class="input" id="${id('label')}" data-k="label" value="${esc(d.label)}" placeholder="e.g. Design" maxlength="24" list="${id('labels')}" autocomplete="off">
        <datalist id="${id('labels')}">${labels.map(l => `<option value="${esc(l)}">`).join('')}</datalist></div>
      <div class="field"><label class="label" for="${id('col')}">${icon('status')}Column</label>
        <select class="input" id="${id('col')}" data-k="col"><option value="">Same as “Add to” below</option>
          ${b.columns.map(c => `<option value="${c.id}" ${c.id === d.col ? 'selected' : ''}>${esc(c.name)}</option>`).join('')}</select></div>
      ${epics.length ? `<div class="field"><label class="label" for="${id('epic')}">${icon('layers')}Epic</label>
        <select class="input" id="${id('epic')}" data-k="epic"><option value="">No epic</option>
          ${epics.map(e => `<option value="${e.id}" ${e.id === d.epic ? 'selected' : ''}>${esc(e.title)}</option>`).join('')}</select></div>` : ''}
    </div>
    <div class="field"><label class="label" for="${id('desc')}">${icon('notes')}Notes <span class="opt">optional</span></label>
      <textarea class="input" id="${id('desc')}" data-k="desc" placeholder="Add context, links or acceptance criteria">${esc(d.desc)}</textarea></div>
    <div class="sugg-edit-foot">
      <button type="button" class="btn btn-quiet" data-reset ${d.edited ? '' : 'disabled'}>${icon('move')}Reset to suggestion</button>
      <button type="button" class="btn" data-done>${icon('check')}Done</button>
    </div>
  </div>`;
}

function bindReview(d) {
  const m = meet.m, all = $('#sel-all'), create = $('#meet-create');
  const sync = () => {
    const n = meet.sel.size, total = m.tasks.length;
    all.checked = n === total; all.indeterminate = n > 0 && n < total;
    $('#sel-count').textContent = `${n} of ${total} selected`;
    create.disabled = !n;
    create.innerHTML = `${icon('plus')}${n ? `Create ${n} task${n > 1 ? 's' : ''}` : 'Select tasks to create'}`;
  };
  d.querySelectorAll('[data-sugg]').forEach(cb => cb.onchange = () => { cb.checked ? meet.sel.add(+cb.dataset.sugg) : meet.sel.delete(+cb.dataset.sugg); sync(); });
  all.onchange = () => {
    meet.sel = new Set(all.checked ? m.tasks.map((_, i) => i) : []);
    d.querySelectorAll('[data-sugg]').forEach(cb => cb.checked = all.checked); sync();
  };
  const highlight = (src, scroll) => {
    d.querySelectorAll('.note.hl').forEach(n => n.classList.remove('hl'));
    const line = src != null && d.querySelector(`[data-line="${src}"]`);
    if (line) {
      line.classList.add('hl');
      const pane = line.closest('.pane');
      if (scroll && pane.scrollHeight > pane.clientHeight) pane.scrollTo({ top: line.offsetTop - pane.offsetTop - pane.clientHeight / 2 + line.offsetHeight / 2, behavior: 'smooth' });
      else if (scroll) line.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
    }
  };
  d.querySelectorAll('.sugg-row').forEach(row => {
    row.onmouseenter = row.onfocusin = () => highlight(row.dataset.src, true);
    row.onmouseleave = () => highlight(null);
  });
  $('#meet-col').onchange = e => meet.col = e.target.value;

  // One details editor open at a time, inside the suggestion's row. Edits save as you type.
  const b = board(), list = d.querySelector('.sugg');
  const rowOf = i => d.querySelector(`[data-row="${i}"]`);
  const paintRow = i => { rowOf(i).querySelector('.sugg-main').innerHTML = suggMain(b, i); };
  const closeEdit = () => {
    const i = meet.open; if (i == null) return;
    const row = rowOf(i); meet.open = null;
    row.querySelector('.sugg-edit')?.remove(); row.classList.remove('editing');
    row.querySelector('[data-edit-btn]').setAttribute('aria-expanded', 'false');
  };
  const openEdit = (i, focus = '[data-k="title"]') => {
    closeEdit();
    const row = rowOf(i); meet.open = i;
    row.insertAdjacentHTML('beforeend', suggEditor(b, i)); row.classList.add('editing');
    row.querySelector('[data-edit-btn]').setAttribute('aria-expanded', 'true');
    row.querySelector(focus)?.focus();
    row.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
  };
  meet.open = null;
  d.querySelectorAll('[data-edit-btn]').forEach(btn => btn.onclick = () => {
    const i = +btn.dataset.editBtn;
    meet.open === i ? (closeEdit(), btn.focus()) : openEdit(i);
  });
  list.oninput = list.onchange = e => {
    const f = e.target.closest('[data-k]'); if (!f) return;
    const i = +f.closest('[data-edit]').dataset.edit, dr = meet.drafts[i], k = f.dataset.k;
    if (k === 'title') { f.toggleAttribute('aria-invalid', !f.value.trim()); if (!f.value.trim()) return; }
    dr[k] = k === 'title' || k === 'label' ? f.value.trim() : f.value;
    if (!dr.edited) { dr.edited = true; rowOf(i).querySelector('[data-reset]').disabled = false; }
    // Working on a suggestion means you want it.
    if (!meet.sel.has(i)) { meet.sel.add(i); rowOf(i).querySelector('[data-sugg]').checked = true; sync(); }
    paintRow(i);
  };
  list.addEventListener('focusout', e => { if (e.target.dataset.k === 'title' && !e.target.value.trim()) { e.target.value = meet.drafts[+e.target.closest('[data-edit]').dataset.edit].title; e.target.removeAttribute('aria-invalid'); } });
  list.onclick = e => {
    if (e.target.closest('[data-done]')) { const i = meet.open; closeEdit(); rowOf(i).querySelector('[data-edit-btn]').focus(); }
    if (e.target.closest('[data-reset]')) { const i = meet.open; meet.drafts[i] = draftOf(m.tasks[i]); paintRow(i); openEdit(i, '[data-done]'); }
  };
  // Escape closes the editor first, not the whole dialog.
  list.onkeydown = e => {
    if (e.key === 'Escape' && e.target.closest('.sugg-edit')) { e.preventDefault(); e.stopPropagation(); const i = meet.open; closeEdit(); rowOf(i).querySelector('[data-edit-btn]').focus(); }
    if (e.key === 'Enter' && e.target.dataset.k === 'title') { e.preventDefault(); list.querySelector('[data-done]').click(); }
  };

  create.onclick = () => {
    const fallback = b.columns.find(x => x.id === meet.col) || b.columns[0];
    const made = [...meet.sel].sort((x, y) => x - y).map(i => {
      const dr = meet.drafts[i], line = m.notes[m.tasks[i].src];
      const c = b.columns.find(x => x.id === dr.col) || fallback;
      const t = { id: uid(), title: dr.title, desc: dr.desc.trim(), label: dr.label, due: dr.due, assignee: b.shared ? dr.who : '', rev: 0, log: [entry('created', { from: m.title })],
        ...(dr.epic ? { epic: dr.epic } : {}),
        source: { type: 'meeting', id: m.id, title: m.title, date: m.date, time: m.time, platform: m.source, url: m.url,
          quote: line?.text || '', who: line?.who || '', at: line?.t || '' } };
      c.tasks.push(t);
      return { t, c };
    });
    touch(b);
    closeMeet(); render();
    made.forEach(x => document.querySelector(`[data-task="${x.t.id}"]`)?.classList.add('landed'));
    document.querySelector(`[data-task="${made[0].t.id}"]`)?.scrollIntoView({ block: 'nearest', inline: 'nearest', behavior: 'smooth' });
    const cols = new Set(made.map(x => x.c));
    toast(`${made.length} task${made.length > 1 ? 's' : ''} added ${cols.size > 1 ? `across ${cols.size} columns` : `to ${[...cols][0].name}`}`);
  };
  sync();
}

const memberByName = name => { const b = board(); return db.users.find(u => u.name === name && b.members.includes(u.id)); };
const personHue = name => { const u = db.users.find(x => x.name === name); return u ? userHue(u.id) : hue(hashHue(name)); };
const personAvatar = name => `<span class="avatar" style="${personHue(name)}" title="${esc(name)}">${initials(name)}</span>`;

ui.detailId = me() ? readRoute() : null;
render();
</script>
